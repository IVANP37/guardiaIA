services:
  guardia:
    build:
      context: .
      args:
        VITE_OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
    image: guardia:latest
    ports:
      - "${APP_PORT:-3003}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_UPSTREAM: ${OLLAMA_UPSTREAM:-http://host.docker.internal:11434}
    restart: unless-stopped
